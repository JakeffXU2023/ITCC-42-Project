<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTA Cashiering System — Receipts Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">
          <img src="SPTA_Logo.png" alt="PTA Cashiering System logo">
        </div>
        <div class="brand-name">SPTA Cashiering<br>System</div>
      </div>

      <div class="nav-section-label">Main</div>
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="nav-item" href="students.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Student Records
      </a>
      <a class="nav-item active" href="reciepts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Receipts Log
      </a>

      <div class="nav-section-label">Finance</div>
      <a class="nav-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Fund Usage
      </a>

      <div class="sidebar-spacer"></div>
      <div class="sidebar-user">
        <div class="user-avatar">AD</div>
        <div>
          <div class="user-name">Admin</div>
          <div class="user-role">Cashier</div>
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <span class="page-title">Receipts Log</span>
          <span class="page-badge">Transaction Log</span>
        </div>
        <div class="topbar-right">
          <a class="btn btn-sm" href="students.html">Student Records</a>
          <a class="btn btn-sm" href="login.html" onclick="signOut()">Sign out</a>
        </div>
      </div>

      <div class="content">
        <div class="card">
          <div class="card-header">
            <span class="card-title">All receipts</span>
            <div style="display:flex;gap:8px;">
              <input id="receipts-search" class="search-input" type="text" placeholder="Search..." style="width:200px;">
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Receipt #</th><th>Student</th><th>Grade / Section</th><th>Fees paid</th><th>Amount</th><th>Date & time</th><th>Actions</th></tr></thead>
              <tbody id="receipts-tbody">
                <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:24px;">No receipts yet.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="receipts.js"></script>
</body>
</html>
