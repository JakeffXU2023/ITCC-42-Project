<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTA Cashiering System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-page">
      <div class="login-card">
        <div class="login-logo">
          <img src="SPTA_Logo.png" alt="SPTA Cashiering System logo">
        </div>
        <div class="login-title">SPTA Cashiering System</div>
        <div class="login-error" id="login-error">Invalid username or password.</div>
        <div class="form-group" style="text-align:left;">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" id="login-user" placeholder="Enter username" value="admin">
        </div>
        <div class="form-group" style="text-align:left;">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" id="login-pass" placeholder="Enter password" value="1234">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;" onclick="doLogin()">Sign In</button>
        <div style="font-size:11px;color:var(--text-muted);margin-top:14px;">Default: admin / 1234</div>
      </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
