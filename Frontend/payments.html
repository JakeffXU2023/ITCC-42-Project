<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTA Cashiering System — New Payment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-name">PTA Cashiering<br>System</div>
        <div class="brand-year">SY 2024–2025</div>
      </div>

      <div class="nav-section-label">Main</div>
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="nav-item" href="students.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Student Records
      </a>
      <a class="nav-item active" href="payments.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        New Payment
      </a>
      <a class="nav-item" href="reciepts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Receipts Log
      </a>

      <div class="nav-section-label">Finance</div>
      <a class="nav-item" href="reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Fee Categories
      </a>
      <a class="nav-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Fund Usage
      </a>

      <div class="sidebar-spacer"></div>
      <div class="sidebar-user">
        <div class="user-avatar">AD</div>
        <div>
          <div class="user-name">Admin</div>
          <div class="user-role">Cashier</div>
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <span class="page-title">New Payment</span>
          <span class="page-badge">Receipt Entry</span>
        </div>
        <div class="topbar-right">
          <a class="btn btn-sm" href="reciepts.html">Receipts Log</a>
          <a class="btn btn-sm" href="login.html" onclick="signOut()">Sign out</a>
        </div>
      </div>

      <div class="content">
        <div class="two-col" style="align-items:start;">
          <div class="card">
            <div class="card-header"><span class="card-title">Payment entry</span></div>
            <div class="card-body">
              <div class="form-group">
                <label class="form-label">Selected student</label>
                <input id="pay-student" class="form-control" type="text" placeholder="Choose grade and section to load students" readonly>
                <div id="pay-student-list" class="pay-student-list" style="margin-top:12px;display:grid;gap:8px;"></div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Grade level</label>
                  <select id="pay-grade" class="form-control">
                    <option value="">Select grade</option>
                    <option value="7">Grade 7</option><option value="8">Grade 8</option><option value="9">Grade 9</option>
                    <option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Section</label>
                  <select id="pay-section" class="form-control"></select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Select fees to pay</label>
                <div id="pay-fee-list" style="display:grid;gap:10px;"></div>
              </div>
              <div style="border-top:1px solid var(--border-light);padding-top:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                <span style="font-size:13px;font-weight:600;">Total amount</span>
                <span id="pay-total" style="font-size:20px;font-weight:700;color:var(--blue-600);">₱0.00</span>
              </div>
              <div style="display:flex;gap:8px;">
                <button id="process-payment-button" class="btn btn-primary" type="button" style="flex:1;justify-content:center;">Process, save & download receipt</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="payments.js"></script>
</body>
</html>
